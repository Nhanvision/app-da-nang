<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Đại Dương Từ Vựng</title>
<meta name="theme-color" content="#0a6ebd">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="sea">
  <div class="sun"></div>
  <div id="bgFish"></div>
  <div id="crossers"></div>
  <svg id="floor" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="bubbles"></div>
  <div id="fishLayer"></div>

  <!-- MENU -->
  <section id="menu" class="panel">
    <h1>🌊 Đại Dương Từ Vựng</h1>
    <p>Đọc nghĩa tiếng Việt, rồi <b>bấm vào con cá mang đúng từ tiếng Anh</b>!</p>
    <div class="levels">
      <button class="lvl" data-lvl="basic"><span>🐠</span><b>Cơ bản</b><small>Từ quen thuộc · cá bơi chậm</small><em id="best-basic"></em></button>
      <button class="lvl" data-lvl="mid"><span>🐬</span><b>Trung bình</b><small>Từ thông dụng · cá bơi vừa</small><em id="best-mid"></em></button>
      <button class="lvl" data-lvl="adv"><span>🦈</span><b>Nâng cao</b><small>Từ khó · cá bơi nhanh</small><em id="best-adv"></em></button>
    </div>
    <label class="opt"><input type="checkbox" id="optSound" checked> 🔊 Đọc to từ tiếng Anh</label>
    <div><button id="btnAdmin" class="link">⚙️ Admin · thêm từ vựng riêng</button></div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="panel" hidden>
    <div id="pinBox">
      <h2>⚙️ Admin</h2>
      <p id="pinHelp"></p>
      <input id="pinIn" type="password" inputmode="numeric" maxlength="8" placeholder="Mã PIN" autocomplete="off">
      <p id="pinMsg" class="err"></p>
      <div class="row"><button id="pinOk" class="big">Vào</button><button id="pinCancel" class="big alt">Quay lại</button></div>
    </div>
    <div id="admBox" hidden>
      <h2>⚙️ Từ vựng riêng</h2>
      <div class="admTabs">
        <button class="admTab" data-lvl="basic">Cơ bản</button><button class="admTab" data-lvl="mid">Trung bình</button><button class="admTab" data-lvl="adv">Nâng cao</button>
      </div>
      <p id="admCount"></p>
      <label class="opt"><input type="checkbox" id="admOnly"> Chỉ dùng từ của tôi (bỏ từ mặc định)</label>
      <textarea id="admText" rows="6" placeholder="Mỗi dòng một từ, dạng:&#10;english - nghĩa tiếng Việt&#10;butterfly - con bướm&#10;grandmother = bà nội"></textarea>
      <div class="row"><button id="admAdd" class="big">Thêm vào danh sách</button></div>
      <p id="admMsg" class="msg"></p>
      <div id="admList"></div>
      <div class="row"><button id="admPin" class="link">🔑 Đổi mã PIN</button></div>
      <div class="row"><button id="admClear" class="big alt">Xoá hết từ riêng cấp này</button><button id="admClose" class="big">Xong</button></div>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" hidden>
    <button id="btnQuit" title="Về menu">✕</button>
    <div id="prompt"><span id="pEmoji"></span><span id="pText"></span></div>
    <div class="stats"><span id="hearts"></span><span id="score">0</span><span id="progress">1/10</span></div>
  </div>

  <!-- KẾT QUẢ -->
  <section id="result" class="panel" hidden>
    <h2 id="rTitle">Hoàn thành!</h2>
    <div id="rStars"></div>
    <p id="rScore"></p>
    <div id="rWrong"></div>
    <div class="row">
      <button id="btnAgain" class="big">Chơi lại</button>
      <button id="btnMenu" class="big alt">Chọn cấp độ</button>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
