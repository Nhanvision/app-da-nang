<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Đại Dương Từ Vựng</title>
<meta name="theme-color" content="#0a6ebd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Đại Dương">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sea">
  <div class="sun"></div>
  <div id="bgFish"></div>
  <div id="crossers"></div>
  <svg id="floor" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="bubbles"></div>
  <div id="fishLayer"></div>

  <!-- MENU -->
  <section id="menu" class="panel">
    <h1>🌊 Đại Dương Từ Vựng</h1>
    <p id="intro"></p>
    <p id="licBanner" class="lic"></p>
    <div class="tabs">
      <button class="tab on" data-mode="kid">🐣 Bé tập nói</button>
      <button class="tab" data-mode="play">🎮 Chơi game</button>
      <button class="tab" data-mode="study">📖 Học từ vựng</button>
      <button class="tab" data-mode="board">🏆 Bảng điểm</button>
    </div>
    <p id="modeHelp" class="hint2"></p>
    <button id="btnReview" class="reviewBtn" hidden></button>
    <button id="btnKid" class="kidBtn" hidden>🐠 Bé bắt đầu nào!</button>
    <div id="boardBox" hidden></div>
    <div class="levels" id="levelsBox">
      <button class="lvl" data-lvl="basic"><span>🐠</span><b>Cơ bản</b><small>Từ quen thuộc, có hình · cá bơi chậm</small><i id="cnt-basic"></i><em id="best-basic"></em></button>
      <button class="lvl" data-lvl="mid"><span>🐬</span><b>Trung bình</b><small>Từ thông dụng, dài hơn</small><i id="cnt-mid"></i><em id="best-mid"></em></button>
      <button class="lvl" data-lvl="adv"><span>🦈</span><b>Nâng cao</b><small>Từ khó, dễ nhầm</small><i id="cnt-adv"></i><em id="best-adv"></em></button>
    </div>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="optSound" checked> 🔊 Đọc to từ tiếng Anh</label>
      <label class="opt"><input type="checkbox" id="optSfx" checked> 🔔 Âm thanh hiệu ứng</label>
      <label class="opt"><input type="checkbox" id="optSlow"> 🐢 Đọc chậm (Bé tập nói)</label>
    </div>
  </section>


  <!-- HỌC TỪ VỰNG -->
  <!-- NHẬP MÃ KÍCH HOẠT -->
  <section id="actPanel" class="panel" hidden>
    <h2>🔑 Nhập mã kích hoạt</h2>
    <p>Nhập mã người bán gửi cho bạn (8 ký tự).</p>
    <input id="actCode" class="codeIn" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" maxlength="12">
    <p id="actMsg" class="msg2err"></p>
    <div class="row"><button id="actGo" class="big">Kích hoạt</button><button id="actCancel" class="big alt">Quay lại</button></div>
    <p class="hint2"><a href="gioi-thieu.html">Chưa có mã? Xem giá và cách mua</a></p>
  </section>

  <section id="study" class="panel" hidden>
    <div class="studyTop"><button id="stBack" class="link">← Về menu</button><b id="stTitle"></b></div>
    <div id="card" class="card3d" tabindex="0" role="button" aria-label="Thẻ từ, bấm để lật">
      <div id="cardEmoji"></div>
      <div id="cardMain"></div>
      <div id="cardHint">Bấm vào thẻ để xem nghĩa</div>
    </div>
    <div class="row">
      <button id="stPrev" class="big alt">‹</button>
      <button id="stSpeak" class="big alt">🔊</button>
      <button id="stNext" class="big">›</button>
    </div>
    <p id="stPos"></p>
    <div class="row">
      <button id="stShuffle" class="link">🔀 Trộn thứ tự</button>
      <button id="stPlay" class="big">🎮 Chơi cấp này</button>
    </div>
    <div id="stList"></div>
  </section>

  <div id="kidCard" hidden><div id="kcEmoji"></div><div id="kcEn"></div><div id="kcVi"></div></div>

  <!-- HUD -->
  <div id="hud" hidden>
    <button id="btnQuit" title="Về menu">✕</button>
    <div id="prompt"><span id="pEmoji"></span><span id="pText"></span><div id="timeBar"><i></i></div></div>
    <div class="stats"><span id="hearts"></span><span id="score">0</span><span id="progress">1/10</span></div>
  </div>

  <!-- KẾT QUẢ -->
  <section id="result" class="panel" hidden>
    <h2 id="rTitle">Hoàn thành!</h2>
    <div id="rStars"></div>
    <p id="rScore"></p>
    <div id="nameRow" hidden>
      <p><b>🏆 Điểm của con vào bảng điểm cao!</b></p>
      <div class="nameBox"><input id="playerName" maxlength="14" placeholder="Tên của con" autocomplete="off"><button id="saveScore" class="big">Lưu</button></div>
    </div>
    <p id="savedMsg" class="msg2"></p>
    <div id="rWrong"></div>
    <div class="row">
      <button id="btnAgain" class="big">Chơi lại</button>
      <button id="btnMenu" class="big alt">Chọn cấp độ</button>
    </div>
  </section>
</div>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="license-key.js"></script>
<script src="license.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
