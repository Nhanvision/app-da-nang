<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Đại Dương Từ Vựng</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin Đại Dương">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adminpage">
<main id="admin" class="card">
  <div id="pinBox">
    <h2>⚙️ Trang dành cho bố mẹ</h2>
    <p id="pinHelp"></p>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="8" placeholder="Mã PIN" autocomplete="off">
    <p id="pinMsg" class="err"></p>
    <div class="row"><button id="pinOk" class="big">Vào</button></div>
    <button id="pinForgot" class="link">Quên mã PIN?</button>
  </div>
  <div id="admBox" hidden>
    <section id="licBox">
      <h2>🔑 Kích hoạt bản đầy đủ</h2>
      <p id="licStatus"></p>
      <div id="licForm">
        <p>Mã máy của thiết bị này:</p>
        <p><code id="devId"></code> <button id="devCopy" class="link">Sao chép</button></p>
        <textarea id="licCode" rows="3" placeholder="Dán mã kích hoạt vào đây"></textarea>
        <div class="row"><button id="licGo" class="big">Kích hoạt</button></div>
        <p id="licMsg" class="msg"></p>
        <div id="shopInfo" class="hint"></div>
      </div>
    </section>
    <div id="admWords">
    <h2>⚙️ Từ vựng riêng</h2>
    <div class="admTabs">
      <button class="admTab" data-lvl="basic">Cơ bản</button><button class="admTab" data-lvl="mid">Trung bình</button><button class="admTab" data-lvl="adv">Nâng cao</button>
    </div>
    <p id="admCount"></p>
    <label class="opt"><input type="checkbox" id="admOnly"> Chỉ dùng từ của tôi (bỏ từ mặc định)</label>
    <textarea id="admText" rows="6" placeholder="Mỗi dòng một từ, dạng:&#10;english - nghĩa tiếng Việt&#10;butterfly - con bướm&#10;grandmother = bà nội"></textarea>
    <div class="row"><button id="admAdd" class="big">Thêm vào danh sách</button></div>
    <p id="admMsg" class="msg"></p>
    <div id="admList"></div>
    <div class="row">
      <button id="admExport" class="big alt">⬇️ Xuất file</button>
      <button id="admImport" class="big alt">⬆️ Nhập file</button>
      <input id="admFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="hint">Xuất/nhập cả 3 cấp độ cùng lúc. Nhập file sẽ <b>gộp</b> vào danh sách hiện có, từ trùng được bỏ qua.</p>
    <div class="row"><button id="admClear" class="big alt">Xoá hết từ riêng cấp này</button></div>
    </div>
    <div class="row"><button id="admPin" class="link">🔑 Đổi mã PIN</button></div>
    <div class="row"><button id="admClose" class="big">Khoá & thoát</button></div>
  </div>
  <p class="back"><a href="index.html">← Về trang chơi của con</a></p>
</main>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="license-key.js"></script>
<script src="license.js"></script>
<script src="admin.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
