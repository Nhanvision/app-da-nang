<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo mã kích hoạt</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a6ebd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../../game/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tạo mã">
<style>
body{font-family:system-ui,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:18px 16px 40px;color:#0a4a82;background:#f3f8fd}
h1{font-size:22px;margin:6px 0 10px}label{display:block;margin:14px 0 4px;font-weight:700}
input,textarea,button{font:inherit;padding:10px;border-radius:10px;border:2px solid #9ec5e6;width:100%;box-sizing:border-box}
button{background:#0a6ebd;color:#fff;border:0;cursor:pointer;margin-top:10px;font-weight:700}
button.alt{background:#7aa7c9}button.link{background:none;color:#0a6ebd;text-decoration:underline;font-weight:400;width:auto;padding:4px 0;margin-top:14px}
textarea{font:13px monospace;word-break:break-all;background:#fff}.msg{margin-top:8px;min-height:1.3em;font-size:15px}
.warn{background:#fff4e5;border-radius:10px;padding:10px;font-size:14px}
section[hidden]{display:none}
#devId{font-size:20px;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<h1>🔑 Tạo mã kích hoạt</h1>
<p class="warn">Trang này chạy hoàn toàn trên thiết bị của anh, không gửi gì đi. Khoá bí mật nếu được lưu sẽ bị <b>mã hoá bằng mật khẩu</b> của anh.</p>

<!-- Lần đầu: nạp khoá -->
<section id="setup" hidden>
  <label>1. Chọn file khoá bí mật (daiduong-private.json)</label>
  <input id="keyFile" type="file" accept=".json,application/json">
  <label>2. Đặt mật khẩu để lưu khoá trên thiết bị này (≥ 6 ký tự)</label>
  <input id="newPass" type="password" autocomplete="new-password" placeholder="Mật khẩu mở khoá (không phải mã PIN game)">
  <button id="saveKey">Lưu khoá vào thiết bị này</button>
  <button id="onceOnly" class="alt">Chỉ dùng một lần, không lưu</button>
</section>

<!-- Đã lưu khoá: mở khoá -->
<section id="unlock" hidden>
  <label>Nhập mật khẩu để mở khoá</label>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Mật khẩu">
  <button id="unlockBtn">Mở khoá</button>
</section>

<!-- Tạo mã -->
<section id="make" hidden>
  <label>Dán Mã máy của khách (XXXX-XXXX-XXXX)</label>
  <input id="devId" placeholder="ABCD-EFGH-JKMN" autocomplete="off" autocapitalize="characters">
  <button id="go">Tạo mã kích hoạt</button>
  <textarea id="out" rows="4" readonly placeholder="Mã kích hoạt sẽ hiện ở đây"></textarea>
  <button id="copy" class="alt">Sao chép mã</button>
</section>

<div id="msg" class="msg"></div>
<button id="forget" class="link" hidden>Xoá khoá khỏi thiết bị này / khoá lại</button>

<script>
const $ = id => document.getElementById(id);
const STORE = 'taoma-key-v1';
const enc = new TextEncoder(), dec = new TextDecoder();
const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = bytes => toB64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const say = t => $('msg').textContent = t;
let signKey = null;

function show(which) {
  ['setup', 'unlock', 'make'].forEach(id => $(id).hidden = id !== which);
  $('forget').hidden = which === 'setup';
}
const ecdsa = { name: 'ECDSA', namedCurve: 'P-256' };
const importPriv = jwk => crypto.subtle.importKey('jwk', jwk, ecdsa, false, ['sign']);

async function passKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function lockJwk(jwkText, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await passKey(pass, salt), enc.encode(jwkText));
  localStorage.setItem(STORE, JSON.stringify({ s: toB64(salt), i: toB64(iv), d: toB64(ct) }));
}
async function unlockJwk(pass) {
  const o = JSON.parse(localStorage.getItem(STORE));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(o.i) }, await passKey(pass, fromB64(o.s)), fromB64(o.d));
  return dec.decode(pt);
}

let pendingJwkText = null;
$('keyFile').onchange = async e => {
  pendingJwkText = null; say('');
  const f = e.target.files[0]; if (!f) return;
  try {
    const text = await f.text();
    await importPriv(JSON.parse(text));
    pendingJwkText = text; say('✅ File khoá hợp lệ.');
  } catch (err) { say('❌ File khoá không hợp lệ.'); }
};
$('saveKey').onclick = async () => {
  if (!pendingJwkText) return say('Hãy chọn file khoá bí mật trước.');
  if ($('newPass').value.length < 6) return say('Mật khẩu cần ít nhất 6 ký tự.');
  await lockJwk(pendingJwkText, $('newPass').value);
  signKey = await importPriv(JSON.parse(pendingJwkText));
  pendingJwkText = null; $('newPass').value = ''; $('keyFile').value = '';
  show('make'); say('✅ Đã lưu khoá (mã hoá). Lần sau chỉ cần nhập mật khẩu.');
};
$('onceOnly').onclick = async () => {
  if (!pendingJwkText) return say('Hãy chọn file khoá bí mật trước.');
  signKey = await importPriv(JSON.parse(pendingJwkText));
  pendingJwkText = null; $('keyFile').value = '';
  show('make'); say('Khoá chỉ nằm trong bộ nhớ, tải lại trang sẽ mất.');
};
$('unlockBtn').onclick = async () => {
  try {
    signKey = await importPriv(JSON.parse(await unlockJwk($('pass').value)));
    $('pass').value = ''; show('make'); say('');
  } catch (err) { say('❌ Sai mật khẩu.'); }
};
$('pass').onkeydown = e => { if (e.key === 'Enter') $('unlockBtn').click(); };
$('forget').onclick = () => {
  if (localStorage.getItem(STORE) && !confirm('Xoá khoá đã lưu khỏi thiết bị này? Anh sẽ cần chọn lại file khoá bí mật.')) return;
  localStorage.removeItem(STORE); signKey = null; $('out').value = ''; show('setup'); say('Đã xoá khoá khỏi thiết bị này.');
};
$('go').onclick = async () => {
  const id = $('devId').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[A-HJ-NP-Z2-9]{12}$/.test(id)) return say('Mã máy phải gồm 12 ký tự (chữ + số, không có 0, 1, O, I).');
  const sig = await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, signKey, enc.encode('DAIDUONG|v1|' + id));
  $('out').value = b64u(new Uint8Array(sig));
  say('✅ Mã dành riêng cho máy ' + id.match(/.{4}/g).join('-') + '. Gửi mã này cho khách.');
};
$('copy').onclick = () => {
  if (!$('out').value) return say('Chưa có mã để sao chép.');
  $('out').select();
  navigator.clipboard.writeText($('out').value).then(() => say('Đã sao chép mã.'), () => say('Hãy bôi đen mã và sao chép thủ công.'));
};

if (!crypto.subtle) say('⚠️ Trình duyệt chỉ ký được khi mở bằng https hoặc localhost.');
show(localStorage.getItem(STORE) ? 'unlock' : 'setup');
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
